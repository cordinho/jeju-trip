<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141A1B">
<title>아기 메머드의 제주 여행</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <div class="title">아기 메머드의 제주 여행</div>
      <div class="sub">2026.10.29 – 11.01</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnAddTop">+ 일정</button>
    <button class="iconbtn" id="btnSet">설정</button>
  </div>
  <div class="days" id="days" role="tablist"></div>
</header>

<div id="mapWrap">
  <div id="map"></div>
  <div class="maprsz" id="mapRsz" role="separator" aria-orientation="horizontal" aria-label="지도 크기 조절"><span></span></div>
</div>
<div class="sum" id="sum"></div>
<main id="list"></main>

<div class="fab">
  <button class="alt" id="btnPoi">추천 장소</button>
  <button id="btnAdd">일정 추가</button>
</div>

<div class="scrim" id="scrim"></div>

<!-- 편집 폼. 시트가 아니라 목록의 해당 카드 안으로 옮겨 넣어 인라인으로 펼친다.
     (06-render.js 가 매 렌더마다 이 노드를 카드 안으로 이동시킨다. 노드를 새로 만들지 않고
      그대로 옮기기 때문에 입력 중이던 값이 다시 그려도 살아남는다.) -->
<div id="edHome" hidden>
  <div class="edbody" id="edBody">
    <div class="edtitle" id="edTitle">일정</div>
    <div class="edwhen" id="edWhen"></div>

    <div class="switch">
      <div><b>시각 고정</b><small>항공기·렌터카처럼 시간이 정해진 일정</small></div>
      <button class="tg" id="fFixOn" aria-pressed="false"></button>
    </div>
    <label class="f" id="fixWrap" style="display:none;margin-top:12px"><span>고정 시각</span>
      <input class="inp" id="fFix" type="time"></label>

    <label class="f"><span>머무는 시간 (분)</span>
      <input class="inp" id="fStay" type="number" min="0" step="5" value="60"></label>
    <div class="chips" style="margin:-6px 0 14px">
      <button class="chip" data-stay="0">0분</button>
      <button class="chip" data-stay="30">30분</button>
      <button class="chip" data-stay="60">1시간</button>
      <button class="chip" data-stay="90">1.5시간</button>
      <button class="chip" data-stay="120">2시간</button>
    </div>

    <label class="f"><span>장소 · 일정 이름</span>
      <input class="inp" id="fName" placeholder="예: 비자림"></label>

    <label class="f"><span>장소 검색 (OpenStreetMap)</span>
      <div class="row">
        <input class="inp" id="fSearch" placeholder="장소를 입력하세요">
        <button class="chip" id="btnSearch" style="flex:0 0 66px">검색</button>
      </div></label>
    <div class="res" id="results" style="display:none"></div>

    <input type="hidden" id="fLat"><input type="hidden" id="fLng">
    <div class="locstat">
      <span id="locStatTxt">위치 미지정 — 이동시간 계산에서 제외됩니다</span>
      <button type="button" id="btnLocClear" hidden>위치 삭제</button>
    </div>
    <button class="chip" id="btnPickHere" style="margin-bottom:14px">지도를 눌러 위치 지정</button>

    <label class="f"><span>다음 장소까지 이동수단</span></label>
    <div class="chips" style="margin:-8px 0 16px">
      <button class="chip" data-move="auto">자동</button>
      <button class="chip" data-move="walk">도보</button>
      <button class="chip" data-move="drive">자차</button>
      <button class="chip" data-move="air">항공</button>
      <button class="chip" data-move="ferry">배</button>
      <button class="chip" data-move="none">계산 안 함</button>
    </div>

    <label class="f"><span>메모</span>
      <textarea class="inp" id="fNote" rows="2" placeholder="예약번호, 오픈시간 등"></textarea></label>

    <div class="actions">
      <button class="ghost" id="btnCancel">닫기</button>
      <button class="danger" id="btnDel">삭제</button>
      <button id="btnSave">저장</button>
    </div>
  </div>
</div>

<!-- 추천 장소 시트 -->
<div class="sheet" id="sheetPoi">
  <div class="shead"><h2>추천 장소</h2><button class="iconbtn" data-close>닫기</button></div>
  <div class="sbody">
    <p class="hint">현재 선택한 날의 마지막 일정 뒤에 추가됩니다. 좌표는 대략값이니 검색으로 다듬으세요.</p>
    <div id="poiList"></div>
  </div>
</div>

<!-- 설정 시트 -->
<div class="sheet" id="sheetSet">
  <div class="shead"><h2>설정</h2><button class="iconbtn" data-close>닫기</button></div>
  <div class="sbody">
    <div class="switch">
      <div><b>실제 도로 경로 사용</b><small>자차 구간의 실거리·소요시간을 도로 경로로 계산합니다. 항공·배 구간은 제외되며, 연결이 안 되면 추정치로 대체합니다.</small></div>
      <button class="tg" id="sOsrm" aria-pressed="false"></button>
    </div>
    <div style="height:14px"></div>
    <label class="f"><span>도보 판정 기준 (km 이하)</span><input class="inp" id="sWalkKm" type="number" step="0.1" value="1"></label>
    <div class="row">
      <label class="f"><span>도보 속도 (km/h)</span><input class="inp" id="sWalkSp" type="number" step="0.5" value="4.5"></label>
      <label class="f"><span>자차 평균 (km/h)</span><input class="inp" id="sDriveSp" type="number" step="1" value="40"></label>
    </div>
    <div class="row">
      <label class="f"><span>직선→도로 보정 계수</span><input class="inp" id="sDetour" type="number" step="0.05" value="1.35"></label>
      <label class="f"><span>주차·환승 여유 (분)</span><input class="inp" id="sBuffer" type="number" step="1" value="5"></label>
    </div>
    <div class="actions" style="margin-bottom:10px">
      <button class="ghost" id="btnExport">내보내기</button>
      <button class="ghost" id="btnImport">가져오기</button>
      <button id="btnSaveSet">적용</button>
    </div>
    <p class="hint">내보내기로 받은 JSON을 다른 기기에서 가져오면 일정이 그대로 옮겨집니다. 홈 화면에 추가해두면 앱처럼 열립니다.</p>
    <button class="chip" id="btnReset" style="color:var(--lava);border-color:var(--lava)">초기 일정으로 되돌리기</button>
    <input type="file" id="fileIn" accept="application/json" hidden>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/leaflet.js"></script>
<script src="js/00-storage.js"></script>
<script src="js/01-seed.js"></script>
<script src="js/02-state.js"></script>
<script src="js/03-schedule.js"></script>
<script src="js/05-map.js"></script>
<script src="js/06-render.js"></script>
<script src="js/07-editor.js"></script>
<script src="js/08-settings.js"></script>
<script src="js/10-main.js"></script>
</body>
</html>
